name: JET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Dart
      uses: dart-lang/setup-dart@v1

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Jaspr CLI
      run: dart pub global activate jaspr_cli

    - name: Install Workspace Dependencies
      run: dart pub get

    - name: Run Linter (Analyze All Packages & Tests)
      run: |
        dart analyze --fatal-infos packages/jet_annotations
        dart analyze --fatal-infos packages/jet_builder
        dart analyze --fatal-infos packages/jet_cli
        dart analyze --fatal-infos packages/jet_mcp
        dart analyze --fatal-infos tests/jet_builder_test

    - name: Check Formatting
      run: |
        dart format --output=none --set-exit-if-changed packages/jet_annotations
        dart format --output=none --set-exit-if-changed packages/jet_builder
        dart format --output=none --set-exit-if-changed packages/jet_cli
        dart format --output=none --set-exit-if-changed packages/jet_mcp
        dart format --output=none --set-exit-if-changed tests/jet_builder_test

    - name: Run Tests (AST Parser, Optimizer, Code Emitter, Visual Cross-Check)
      run: cd tests/jet_builder_test && dart test

    - name: Dry Run Publish (Check for Pub.dev warnings)
      run: |
        cd packages/jet_builder && dart pub publish --dry-run
        cd ../jet_cli && dart pub publish --dry-run
